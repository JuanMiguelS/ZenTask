<form action="" (ngSubmit) = "onSubmit()">
    <h2>Register New Task</h2>
    <div>
        <label for="">Id</label>
        <input type=number name="id" id=""[(ngModel)]="id">
    </div>
    <div>
        <label for="">Name of the User</label>
        <input type="text" name="title" id=""[(ngModel)]="title">
    </div>
    <div>
        <label for="">Time</label>
        <input type=number name="time" id="" [(ngModel)]="time">
    </div>
    <div>
        <label for=""> Time Left</label>
        <input type=number name="timeLeft" id="" [(ngModel)]="timeLeft">
    </div>
    <input type="submit" value="Confirm">
</form>
