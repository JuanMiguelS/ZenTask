<div class="row" [ngClass]="{'completed': item.completed}">
  <div class="title"> 
    <input type="checkbox" [checked]="item.completed" (change)="onToggle(item)">
    {{item.title}}
  </div>
  <div class="time"> 
    {{item.time}}
  </div>
  <div class="timeLeft">
    {{item.timeLeft}}
  </div>
  <div class="total">
    {{(item.time * item.timeLeft)}}
  </div>
  <div class="actions">
    <button (click)="onDelete(item)">
      Eliminar
    </button>
  </div>
</div>
