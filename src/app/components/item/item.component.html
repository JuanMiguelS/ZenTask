<div class="row" [ngClass]="{'completed': item.completed}">
  <div class="title">
    <input type="checkbox" [checked]="item.completed" (change)="onToggle(item)">
    {{item.title}}
  </div>

  <div class="time">
    <p>{{item.time}}</p>
  </div>

  <div class="timeLeft">
    <p>{{item.timeDone}}</p>
  </div>

  <div class="total">
    {{ (item.time - item.timeDone) }}
  </div>

  <div class="actions">
<button (click)="onAskDelete(item)">
  {{ getDeleteButtonText() }}
</button>



  </div>
</div>




<div class="confirm-dialog" *ngIf="showConfirmDialog">
  <div class="confirm-content" #modalBox>
    <div class="confirm-header" (mousedown)="startDragging($event)">
      {{'Confirmar' }}
    </div>
    <p>{{  '¿Estás seguro de que quieres eliminar este elemento?' }}</p>
    <div class="confirm-buttons">
      <button (click)="confirmDelete()">✔️ {{  'Sí' }}</button>
      <button (click)="closeDialog()">❌ {{ 'No' }}</button>
    </div>
  </div>
</div>
