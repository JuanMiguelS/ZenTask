<div class="row" [ngClass]="{'completed': item.completed}">
  <div class="title">
    <input type="checkbox" [checked]="item.completed" (change)="onToggle(item)">
    {{item.title}}
  </div>

  <div class="time">
    <p>{{item.time}}</p>
  </div>

  <div class="timeLeft">
    <p>{{item.timeDone}}</p>
  </div>

  <div class="total">
    {{ (item.time - item.timeDone) }}
  </div>

  <div class="actions">
    <button (click)="onDelete(item)">
      {{ getDeleteButtonText() }} <!-- Traducir dinámicamente el texto del botón -->
    </button>
  </div>
</div>
