<div class="calendar-container">
  <button class="add-event-btn">+ Añadir evento</button>

  <div class="calendar-grid">
    <!-- Días de la semana -->
    <div class="day-name" *ngFor="let day of weekDays">{{ day }}</div>

    <!-- Días del mes -->
    <div class="day-cell" *ngFor="let day of daysInMonth">{{ day }}</div>
  </div>
</div>
