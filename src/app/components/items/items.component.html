<div class="main-container">
  <app-total [message]="totalMessage" [total]="total"></app-total>

  <div *ngFor="let item of items" class="item">
    <app-item 
      [item]="item"
      (deleteItem)="deleteItem($event)"
      (toggleItem)="toggleItem($event)">
    </app-item>

    <!-- Botón para enviar a timer -->
    <button (click)="sendToTimer(item)" class="send-to-timer-btn">
      Enviar a Timer
    </button>
  </div>
</div>
